[project]
name = "remixkit"
version = "0.1.0"
description = "RemixKit — the label's artist console. Genblaze fan-out, B2 provenance, no database tier."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "genblaze-core>=0.3.7",
]

[project.optional-dependencies]
# Provider + storage extras are opt-in, exactly as Genblaze ships them. The app runs
# end-to-end with none of these installed — see adapters/generator_mock.py.
b2 = ["genblaze-s3>=0.3"]
gmicloud = ["genblaze-gmicloud"]
google = ["genblaze-google"]
elevenlabs = ["genblaze-elevenlabs"]
queue = ["boto3>=1.34"]
# Measuring an uploaded master: tempo, drop, sections. numpy only — the decode is ffmpeg
# on PATH (or the standard library for a PCM WAV), and there is deliberately no librosa:
# content/RHYTHM-STUDY.md establishes that the standard segmentation moves do not work on
# this material, so the methods here are the two tools in content/bin, ported.
audio = ["numpy>=1.26"]
# Reading the words off a master. The ElevenLabs SDK direct rather than through Genblaze:
# `genblaze-elevenlabs` ships providers for *generating* speech, and Scribe is the other
# direction — there is no generator step to hang a transcription on. The key is the same
# one `adapters/providers.py` already reads for TTS.
lyrics = ["elevenlabs>=2.0"]
dev = ["pytest>=8.2", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["remixkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
