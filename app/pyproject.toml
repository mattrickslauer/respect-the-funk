[project]
name = "remixkit"
version = "0.1.0"
description = "RemixKit — the label's artist console. Genblaze fan-out, B2 provenance, no database tier."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "genblaze-core>=0.3.7",
]

[project.optional-dependencies]
# Provider + storage extras are opt-in, exactly as Genblaze ships them. The app runs
# end-to-end with none of these installed — see adapters/generator_mock.py.
b2 = ["genblaze-s3>=0.3"]
gmicloud = ["genblaze-gmicloud"]
elevenlabs = ["genblaze-elevenlabs"]
queue = ["boto3>=1.34"]
dev = ["pytest>=8.2", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["remixkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
