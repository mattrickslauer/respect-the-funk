<!doctype html>
<html lang="en" data-ground="lathe">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Spindle{% endblock %}</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="An agentic OS for record labels.">
{% include "_design.html" %}
  <style>
    /* =====================================================================
       The public surface. The sign-in form lives here, and it is the door to
       the console rather than the console itself.

       Different job, so deliberately different rules: the console is 13px and
       26px rows because it is a thing you scan for hours; this is read once,
       by someone deciding whether to go in. Generous type, one column.

       ## This file no longer owns a palette either

       It carried an `--accent` of #63b3c4, which is the console's `--meas` — the
       same colour, arrived at independently, for an unrelated purpose, and
       `_design.html` names that exact collision in its header as the reason it
       exists. It
       would be a poor joke to leave the file that supplied the example as the
       last one outside the system, so the palette now arrives by include and
       what remains below is an alias block.
       ===================================================================== */
    :root {
      --bg:var(--ground);
      --sunk:var(--panel-2);
      --line:var(--rule);
      --line2:var(--rule-strong);
      /* One local name did two jobs: the primary button and the brand dot. Under
         two poles those are different things — a button is the warm pole, because
         it is the thing being put in front of a person, and the dot is the cold
         one, because it means the system is up. Split rather than compromised. */
      --accent:var(--phosphor);
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--ink);
      font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    a { color:inherit; }
    .wrap { max-width:860px; margin:0 auto; padding:0 1.5rem; }

    /* ---- chrome -------------------------------------------------------- */
    header.top {
      display:flex; align-items:center; gap:.6rem;
      padding:1.1rem 1.5rem; border-bottom:1px solid var(--line);
    }
    /* `nowrap`, or the wordmark shrinks as a flex item and breaks across three
       lines. Flex items may shrink below their content width, and a three-word
       brand is exactly the shape that reveals it. */
    header.top .wordmark { font-weight:640; letter-spacing:-.015em; white-space:nowrap; }
    header.top { flex-wrap:wrap; }
    header.top .dot { width:7px; height:7px; border-radius:50%; background:var(--carrier); }
    header.top nav { margin-left:auto; display:flex; gap:.5rem; align-items:center; }

    /* ---- buttons ------------------------------------------------------- */
    .btn {
      font:inherit; font-size:14px; font-weight:520; padding:.5rem .95rem;
      border-radius:var(--r); border:1px solid var(--line2);
      background:var(--panel); color:var(--ink);
      text-decoration:none; cursor:pointer; white-space:nowrap;
      display:inline-flex; align-items:center; justify-content:center; min-height:44px;
    }
    .btn:hover { border-color:var(--faint); }
    .btn.p { background:var(--accent); border-color:var(--accent); color:var(--bg); }
    .btn.p:hover { filter:brightness(1.08); }
    .btn.lg { font-size:15px; padding:.65rem 1.3rem; }
    .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline:2px solid var(--accent); outline-offset:2px;
    }

    /* ---- type ---------------------------------------------------------- */
    h1 {
      font-size:clamp(30px,5.2vw,46px); line-height:1.1; letter-spacing:-.03em;
      font-weight:660; margin:0 0 1rem; max-width:17ch;
    }
    h2 {
      font-size:12px; letter-spacing:.14em; text-transform:uppercase;
      color:var(--faint); font-weight:640; margin:0 0 1.1rem;
    }
    .lede { font-size:18px; line-height:1.55; color:var(--dim); max-width:56ch; margin:0 0 2rem; }
    .lede b { color:var(--ink); font-weight:560; }
    section { padding:3.4rem 0; border-top:1px solid var(--line); }
    section:first-of-type { border-top:0; padding-top:3.8rem; }

    /* ---- forms --------------------------------------------------------- */
    .field { display:grid; gap:.3rem; margin-bottom:1rem; }
    .field label { font-size:12.5px; color:var(--faint); letter-spacing:.02em; }
    /* 16px, not 15px. One pixel under the threshold and iOS Safari zooms the
       viewport on focus and does not zoom back — on the token field, which is the
       very first thing a new operator touches. */
    input, textarea, select {
      font:inherit; font-size:16px; padding:.62rem .7rem; width:100%;
      min-height:44px;
      background:var(--sunk); color:var(--ink);
      border:1px solid var(--line2); border-radius:var(--r);
    }
    textarea { min-height:84px; }
    textarea { resize:vertical; min-height:84px; line-height:1.5; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:0 1rem; }
    @media (max-width:600px) { .two { grid-template-columns:1fr; } }
    .hint { font-size:12.5px; color:var(--faint); }

    /* ---- notices ------------------------------------------------------- */
    .notice {
      border:1px solid var(--line2); border-left:2px solid var(--accent);
      background:var(--panel); padding:.85rem 1rem; border-radius:var(--r);
      font-size:14px; color:var(--dim); margin:0 0 1.6rem;
    }
    .notice.bad { border-left-color:var(--err); }
    .notice b { color:var(--ink); }

    footer {
      border-top:1px solid var(--line); padding:1.6rem 0 3rem;
      font-size:13px; color:var(--faint);
    }
  </style>
</head>
<body>
  <header class="top">
    <span class="dot"></span>
    <span class="wordmark">Spindle</span>
    <nav>{% block topnav %}{% endblock %}</nav>
  </header>
  {% block body %}{% endblock %}
</body>
</html>
