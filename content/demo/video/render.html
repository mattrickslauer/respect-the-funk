<!doctype html>
<meta charset="utf-8">
<title>RemixKit — demo visuals</title>
<!--
  The picture track for the generated half of the demo voice-over.

  Nothing here animates on its own. There is one entry point, `window.SEEK(t)`, which
  puts the whole 1920×1080 stage into the state it should be in at second `t` and
  resolves once every video on screen has finished seeking. capture.js walks t in 1/30s
  steps and screenshots each one, so the render is a pure function of time: the same
  build produces the same frames, and a re-run after an edit only differs where the edit
  was. A CSS animation or a requestAnimationFrame loop would have tied the output to how
  fast the capture machine happened to be running.

  Cue times are not typed in. They are looked up by phrase against out/alignment.json —
  the character-level alignment ElevenLabs returned with the audio — so a highlight fires
  on the frame where its word is actually spoken. Re-cutting the voice-over re-times the
  edit with it; nothing has to be re-measured by hand. If a phrase stops matching, CUE
  says so in the console instead of silently rendering at zero.

  Colours and type are the console's own tokens, read from ui/static/console.css. The
  slides are the product's design system, not a deck's.
-->
<style>
  :root {
    --bg: #14121a;
    --bg-2: #0e0c14;
    --panel: #1c1926;
    --panel-2: #232030;
    --ink: #ffffff;
    --ink-2: #c8c4d4;
    --ink-3: #8b8698;
    --rule: rgba(255, 255, 255, 0.10);
    --rule-2: rgba(255, 255, 255, 0.055);
    --gold: #f5b940;
    --gold-dim: #b07d12;
    --ok: #199e70;
    --warn: #c98500;
    --err: #d95926;
    --bb-red: #E20626;
    --display: "Futura", "Avenir Next", system-ui, sans-serif;
    --body: "Avenir Next", "Helvetica Neue", Helvetica, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
  }

  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, #1b1826 0%, var(--bg-2) 62%),
      var(--bg-2);
    font-family: var(--body);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /*
    A large, very soft light source that drifts for the whole 120 seconds. It is doing
    two jobs: it keeps the type-only scenes from being a completely frozen frame, which
    reads as a stalled video rather than a held shot, and it gives x264 something to
    spend bits on other than banding the flat panels.
  */
  #bgfx {
    position: absolute;
    left: -30%;
    top: -40%;
    width: 160%;
    height: 180%;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(38% 34% at 30% 30%, rgba(245, 185, 64, 0.055) 0%, transparent 70%),
      radial-gradient(32% 30% at 72% 62%, rgba(226, 6, 38, 0.045) 0%, transparent 72%);
    will-change: transform;
  }

  .scene { z-index: 1; }

  /* A very slow vignette + grain keeps flat fills from banding on encode. */
  #stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 900;
    background: radial-gradient(130% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
  }

  .scene {
    position: absolute;
    inset: 0;
    opacity: 0;
    will-change: opacity, transform;
  }

  /* ---------------------------------------------------------------- screenshots */

  .shot {
    position: absolute;
    overflow: hidden;
    border-radius: 10px;
    border: 1px solid var(--rule);
    background: var(--bg-2);
    box-shadow: 0 40px 90px -20px rgba(0, 0, 0, 0.8);
  }

  .cam {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
  }

  .cam > img { display: block; }

  .hl {
    position: absolute;
    border: 3px solid var(--gold);
    border-radius: 6px;
    background: rgba(245, 185, 64, 0.10);
    box-shadow: 0 0 0 9999px rgba(8, 7, 12, 0.0);
  }

  .hl.ok { border-color: var(--ok); background: rgba(25, 158, 112, 0.12); }
  .hl.err { border-color: var(--err); background: rgba(217, 89, 38, 0.12); }

  /* A label sits in shot space, not camera space, so it never scales with the pan. */
  .tag {
    position: absolute;
    font-family: var(--mono);
    font-size: 19px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--bg-2);
    background: var(--gold);
    padding: 7px 13px;
    border-radius: 4px;
    white-space: nowrap;
    font-weight: 600;
  }

  .tag.ok { background: var(--ok); color: #fff; }
  .tag.err { background: var(--err); color: #fff; }

  /* ---------------------------------------------------------------- typography */

  .kicker {
    font-family: var(--mono);
    font-size: 20px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .head {
    font-family: var(--display);
    font-weight: 500;
    letter-spacing: -0.015em;
    line-height: 1.02;
  }

  .sub {
    font-family: var(--body);
    color: var(--ink-2);
    line-height: 1.42;
  }

  .mono { font-family: var(--mono); }

  .num {
    font-family: var(--display);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------------------------------------------------------------- panels */

  .card {
    position: absolute;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--rule);
    border-radius: 12px;
  }

  .card .t {
    font-family: var(--mono);
    font-size: 16px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .rule { position: absolute; background: var(--rule); }

  .dot {
    position: absolute;
    border-radius: 50%;
    background: var(--gold);
  }

  svg.wire { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  svg.wire path { fill: none; stroke: var(--rule); stroke-width: 2; }
  svg.wire path.live { stroke: var(--gold); stroke-width: 3; }

  .tile { position: absolute; overflow: hidden; border-radius: 8px; background: #000; border: 1px solid var(--rule); }
  .tile video, .tile img { display: block; width: 100%; height: 100%; object-fit: cover; }

  .stamp {
    position: absolute;
    font-family: var(--mono);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    border: 3px solid var(--ok);
    color: var(--ok);
    padding: 10px 20px;
    border-radius: 6px;
  }

  .stamp.err { border-color: var(--err); color: var(--err); }

  .bb { position: absolute; }
  .bb img { display: block; }
</style>

<div id="stage"></div>

<script>
// ---------------------------------------------------------------------------- maths

const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, p) => a + (b - a) * p;

// Progress of a sub-animation that starts at `t0` and lasts `dur`, at time `t`.
const at = (t, t0, dur) => clamp((t - t0) / dur);

const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
// Overshoot, used only where something should feel like it snapped into place.
const easeBack = p => { const c = 1.70158 + 1; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

const px = v => v.toFixed(2) + "px";

// ---------------------------------------------------------------------------- cues

// Natural sizes of the captured console pages. The camera works in these coordinates.
const IMG = {
  "01-landing":   [2880, 2800],
  "02-roster":    [2880, 2000],
  "03-artist":    [2880, 2600],
  "04-identity":  [2880, 3000],
  "05-catalogue": [2880, 2000],
  "06-song":      [2880, 3200],
  "07-generate":  [2880, 3600],
  "08-kit":       [2880, 3200],
  "09-verify":    [2880, 2000],
  "10-settings":  [2880, 3000],
};

/**
 * The moving b-roll, as frame sequences rather than clips.
 *
 * build.py explodes each 8-second clip to one JPEG per frame. Playing them back is an
 * `<img>` whose src changes, which costs a decode of a 540-wide JPEG; seeking four real
 * `<video>` elements per frame cost a video decode each and dropped the capture below
 * one frame per second. The pictures on screen are the same pictures.
 */
const CLIP_FPS = 30, CLIP_FRAMES = 240;     // 8s at 30fps
const CLIPS = ["perf", "direct", "backdrop", "extra"];

const BROLL = {
  stillA: "../broll/9d17650d-3779-453b-93a6-33b2bbe5d5bb.png",
  stillB: "../broll/dc07b58f-f663-4d8c-b09d-6581a7c67c87.png",
};

const clipFrame = (key, i) =>
  `out/broll-frames/${key}/${String(i).padStart(5, "0")}.jpg`;

let WORDS = [];
let TOKENS = [];   // one entry per searchable token, pointing back at its spoken word

const norm = s => s.toLowerCase().replace(/[^a-z0-9']+/g, " ").trim();

/**
 * Flatten the spoken words into tokens.
 *
 * The alignment's idea of a word is "the run of characters between two spaces", so
 * `byte-identical,` is one word. A phrase written in a cue is normalised the same way
 * either side of the hyphen, giving two tokens. Indexing tokens rather than words is
 * what lets `CUE("byte-identical")` and `CUE("no tempo without")` both match without
 * the caller having to know how the narrator's text was punctuated.
 */
function indexWords() {
  TOKENS = [];
  WORDS.forEach((w, wi) => {
    const parts = norm(w.word).split(" ").filter(Boolean);
    parts.forEach(p => TOKENS.push({ tok: p, wi, start: w.start, end: w.end }));
  });
}

function findPhrase(phrase) {
  const want = norm(phrase).split(" ").filter(Boolean);
  for (let i = 0; i + want.length <= TOKENS.length; i++) {
    let hit = true;
    for (let j = 0; j < want.length; j++) {
      if (TOKENS[i + j].tok !== want[j]) { hit = false; break; }
    }
    if (hit) return [TOKENS[i], TOKENS[i + want.length - 1]];
  }
  return null;
}

/** Start time of the first word of `phrase`, matched against the spoken alignment. */
function CUE(phrase) {
  const m = findPhrase(phrase);
  if (!m) { console.warn("CUE MISS:", phrase); return 0; }
  return m[0].start;
}

/** End time of the last word of `phrase`. */
function CUE_END(phrase) {
  const m = findPhrase(phrase);
  if (!m) { console.warn("CUE MISS (end):", phrase); return 0; }
  return m[1].end;
}

// ---------------------------------------------------------------------------- DOM

const stage = document.getElementById("stage");
const bgfx = document.createElement("div");
bgfx.id = "bgfx";
stage.appendChild(bgfx);
const el = (tag, cls, css, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (css) Object.assign(n.style, css);
  if (html != null) n.innerHTML = html;
  return n;
};

/**
 * A framed console screenshot with a camera over it.
 *
 * `box` is where the frame sits on the 1920×1080 stage. Everything after that is in the
 * screenshot's own pixel coordinates, so a highlight can be written down once from the
 * capture and stays correct however the camera moves.
 */
function makeShot(name, box) {
  const [W, H] = IMG[name];
  const shot = el("div", "shot", { left: px(box.x), top: px(box.y), width: px(box.w), height: px(box.h) });
  const cam = el("div", "cam");
  const img = el("img", null, { width: px(W), height: px(H) });
  img.src = `../screenshots/${name}.png`;
  cam.appendChild(img);
  shot.appendChild(cam);
  shot._cam = cam; shot._nat = [W, H]; shot._box = box; shot._hls = {}; shot._tags = {};
  return shot;
}

/**
 * Point the camera at a normalised rectangle of the screenshot.
 * `c` = {x, y, w} as fractions of image width/height; height follows the frame's aspect.
 */
function cam(shot, c) {
  const [W, H] = shot._nat, box = shot._box;
  const scale = box.w / (c.w * W);
  shot._cam.style.transform = `translate(${px(-c.x * W * scale)}, ${px(-c.y * H * scale)}) scale(${scale})`;
  shot._scale = scale; shot._c = c;
}

const camLerp = (a, b, p) => ({ x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p), w: lerp(a.w, b.w, p) });

/** A highlight box over the screenshot, in normalised image coordinates. */
function hl(shot, key, r, p, kind) {
  let n = shot._hls[key];
  if (!n) { n = el("div", "hl"); shot._cam.appendChild(n); shot._hls[key] = n; }
  const [W, H] = shot._nat;
  n.className = "hl" + (kind ? " " + kind : "");
  const grow = lerp(1.06, 1, easeBack(clamp(p * 1.4)));
  const w = r.w * W, h = r.h * H;
  Object.assign(n.style, {
    left: px(r.x * W - (w * (grow - 1)) / 2),
    top: px(r.y * H - (h * (grow - 1)) / 2),
    width: px(w * grow),
    height: px(h * grow),
    opacity: clamp(p * 2),
    borderWidth: px(3 / (shot._scale || 1)),
    borderRadius: px(6 / (shot._scale || 1)),
  });
}

/**
 * A label pinned to a point in image space but drawn in stage space, so it keeps its
 * size while the camera pushes in.
 */
function tag(shot, key, imgPt, text, p, kind, dx = 0, dy = 0) {
  let n = shot._tags[key];
  if (!n) { n = el("div", "tag"); shot.appendChild(n); shot._tags[key] = n; }
  const [W, H] = shot._nat, c = shot._c, s = shot._scale;
  n.className = "tag" + (kind ? " " + kind : "");
  n.textContent = text;
  const sx = (imgPt.x * W - c.x * W) * s + dx;
  const sy = (imgPt.y * H - c.y * H) * s + dy;
  Object.assign(n.style, {
    left: px(sx), top: px(sy),
    opacity: clamp(p * 2.2),
    transform: `translateY(${px(lerp(10, 0, easeOut(p)))})`,
  });
}

function hideExtras(shot) {
  for (const k in shot._hls) shot._hls[k].style.opacity = 0;
  for (const k in shot._tags) shot._tags[k].style.opacity = 0;
}

/** Reveal helper: fade + rise, driven by progress. */
function rise(n, p, dist = 26) {
  n.style.opacity = clamp(p * 1.6);
  n.style.transform = `translateY(${px(lerp(dist, 0, easeOut(p)))})`;
}

/** Text typed on by progress, with a block caret while it runs. */
function typeOn(n, text, p, caret = true) {
  const cut = Math.round(text.length * clamp(p));
  n.textContent = text.slice(0, cut);
  if (caret && p > 0 && p < 1) n.textContent += "▍";
}

const money = v => "$" + v.toFixed(2);

// ---------------------------------------------------------------------------- videos

const PENDING = [];   // image decodes this frame is waiting on

function makeVideo(key, box, cls) {
  const t = el("div", "tile " + (cls || ""), { left: px(box.x), top: px(box.y), width: px(box.w), height: px(box.h) });
  const i = el("img");
  i.src = clipFrame(key, 0);
  t.appendChild(i);
  t._key = key; t._img = i; t._at = 0;
  return t;
}

function makeStill(src, box, cls) {
  const t = el("div", "tile " + (cls || ""), { left: px(box.x), top: px(box.y), width: px(box.w), height: px(box.h) });
  const i = el("img"); i.src = src; t.appendChild(i);
  return t;
}

/** Park a clip at a time, looping within its own 8s length. */
function seekTile(tile, time) {
  if (!tile._key) return;
  let f = Math.round(time * CLIP_FPS) % CLIP_FRAMES;
  if (f < 0) f += CLIP_FRAMES;
  if (f === tile._at) return;
  tile._at = f;
  const img = tile._img;
  img.src = clipFrame(tile._key, f);
  // decode() resolves when the new frame is ready to paint; without it the screenshot
  // can catch the previous one still on screen.
  PENDING.push(img.decode().catch(() => {}));
}

// ============================================================================ scenes

const SCENES = [];
function scene(id, build) {
  const root = el("div", "scene");
  root.dataset.id = id;
  stage.appendChild(root);
  const s = { id, root, in: 0, out: 0 };
  s.update = build(root, s) || (() => {});
  SCENES.push(s);
  return s;
}

// Fade between scenes. Short — the cuts should feel like an edit, not a slideshow.
const XF = 0.28;
</script>

<script>
// ---------------------------------------------------------------------------- 1 · register

function buildScenes() {

// ---- s1 · Register an artist · the consent gate ---------------------------------
// v2 leads with consent rather than mentioning it in passing, so this scene ends where
// the identity build begins instead of carrying both.
scene("register", (root, s) => {
  s.in = CUE("Register an artist"); s.out = CUE("Build the identity");

  const shot = makeShot("02-roster", { x: 300, y: 150, w: 1320, h: 780 });
  root.appendChild(shot);

  const kick = el("div", "kicker", { position: "absolute", left: "300px", top: "92px" }, "STEP 01 · ROSTER");
  const head = el("div", "head", { position: "absolute", left: "300px", top: "962px", fontSize: "52px" });
  root.appendChild(kick); root.appendChild(head);

  const wide = { x: 0.10, y: 0.02, w: 0.62 };
  const onAmanda = { x: 0.145, y: 0.055, w: 0.30 };
  const onBoth = { x: 0.155, y: 0.075, w: 0.44 };

  const tConsent = CUE("Consent is recorded");
  const tNo = CUE("no consent, no generation");

  return (t) => {
    hideExtras(shot);
    const p = at(t, s.in, 1.1);
    shot.style.opacity = 1;
    root.style.transform = `scale(${lerp(1.03, 1, easeOut(p))})`;

    // Wide, in on the artist who has consent, then out to hold the one who does not.
    let c;
    if (t < tNo) c = camLerp(wide, onAmanda, easeInOut(at(t, s.in, Math.max(0.8, tNo - s.in))));
    else c = camLerp(onAmanda, onBoth, easeInOut(at(t, tNo, 1.3)));
    c = { x: c.x, y: c.y - 0.004 * easeInOut(at(t, s.in, s.out - s.in)), w: c.w };
    cam(shot, c);

    rise(kick, at(t, s.in, 0.6));
    head.style.opacity = clamp(at(t, tConsent + 0.4, 0.5) * 1.6);
    head.innerHTML = t < tNo
      ? 'Recorded <span style="color:var(--gold)">before</span> anything can be generated.'
      : 'A <span style="color:var(--gold)">gate</span>, not a policy page.';

    const pc = at(t, tConsent + 0.5, 0.5);
    if (pc > 0) {
      hl(shot, "consent", { x: 0.183, y: 0.183, w: 0.163, h: 0.062 }, pc, "ok");
      tag(shot, "consent", { x: 0.183, y: 0.183 }, "likeness consent · on file", pc, "ok", 0, -46);
    }
    const pb = at(t, tNo, 0.5);
    if (pb > 0) {
      hl(shot, "blocked", { x: 0.371, y: 0.172, w: 0.163, h: 0.062 }, pb, "err");
      tag(shot, "blocked", { x: 0.371, y: 0.172 }, "no consent · generation blocked", pb, "err", 0, -46);
    }
  };
});

// ---- s1b · Build the identity once ----------------------------------------------
// New in v2. The script now says what an identity actually is — frames, the words the
// model is told, the words it must never render — so the identity screen carries it.
scene("identity", (root, s) => {
  s.in = CUE("Build the identity"); s.out = CUE("Attach a song");

  // Portrait frame, because the thing being shown is a portrait: at 700×940 the shot's
  // aspect matches the reference-frame image on the page (0.745), so a crop tight enough
  // to read it does not slice the face in half the way a landscape window did.
  const shot = makeShot("04-identity", { x: 140, y: 96, w: 700, h: 940 });
  root.appendChild(shot);

  const kick = el("div", "kicker", { position: "absolute", left: "140px", top: "48px" }, "STEP 02 · IDENTITY");
  const head = el("div", "head", { position: "absolute", left: "920px", top: "112px", width: "820px", fontSize: "50px" },
    'Built <span style="color:var(--gold)">once</span>, and reused by every kit after it.');
  root.appendChild(kick); root.appendChild(head);

  // Three facts, arriving as the narrator names them.
  const facts = [
    ["REFERENCE FRAMES", "five, across angles and lighting"],
    ["WHAT THE MODEL IS TOLD", "a 220-character budget, prepended to every shot"],
    ["WHAT IT MUST NEVER RENDER", "anti-drift negatives, sent as negative_prompt"],
  ].map(([k, v], i) => {
    const n = el("div", "card", { left: "920px", top: px(320 + i * 200), width: "820px", height: "176px", padding: "28px" });
    n.appendChild(el("div", "mono", { fontSize: "14px", letterSpacing: "0.16em", color: "var(--gold)" }, k));
    n.appendChild(el("div", "sub", { fontSize: "23px", marginTop: "14px" }, v));
    root.appendChild(n);
    return n;
  });

  // The whole reference image (x 0.432–0.735, y 0.145–0.535), then the form describing it.
  const onFrames = { x: 0.420, y: 0.135, w: 0.33 };
  const onControls = { x: 0.160, y: 0.200, w: 0.25 };

  const tFrames = CUE("reference frames across angles");
  const tTold = CUE("the words the model is told");
  const tNever = CUE("must never render");

  return (t) => {
    hideExtras(shot);
    // Start on the reference frames, drift to the controls that describe them.
    const c = camLerp(onFrames, onControls, easeInOut(at(t, tTold, 3.2)));
    cam(shot, c);
    shot.style.opacity = clamp(at(t, s.in, 0.6) * 1.6);
    rise(kick, at(t, s.in, 0.5));
    rise(head, at(t, s.in + 0.2, 0.6));

    const cues = [tFrames, tTold, tNever];
    facts.forEach((n, i) => {
      const p = at(t, cues[i] - 0.25, 0.55);
      n.style.opacity = clamp(p * 1.6);
      n.style.transform = `translateX(${px(lerp(30, 0, easeOut(p)))})`;
    });

    const pf = at(t, tFrames, 0.5);
    if (pf > 0) hl(shot, "frames", { x: 0.432, y: 0.143, w: 0.303, h: 0.395 }, pf);
    const pn = at(t, tNever, 0.5);
    if (pn > 0) hl(shot, "neg", { x: 0.168, y: 0.545, w: 0.232, h: 0.045 }, pn, "err");
  };
});

// ---- s2 · Attach a song — measured once ----------------------------------------
scene("song", (root, s) => {
  s.in = CUE("Attach a song"); s.out = CUE("Then generate");

  const shot = makeShot("06-song", { x: 90, y: 150, w: 1080, h: 800 });
  root.appendChild(shot);

  const kick = el("div", "kicker", { position: "absolute", left: "90px", top: "92px" }, "STEP 02 · MEASUREMENT");

  const panel = el("div", "card", { left: "1230px", top: "150px", width: "600px", height: "800px", padding: "34px" });
  const bpmLabel = el("div", "mono", { fontSize: "17px", letterSpacing: "0.22em", color: "var(--ink-3)" }, "TEMPO");
  const bpm = el("div", "num", { fontSize: "128px", lineHeight: "1.05", color: "var(--gold)" }, "0.00");
  const bpmUnit = el("div", "mono", { fontSize: "22px", color: "var(--ink-3)", marginTop: "-6px" }, "BPM");

  const rowsWrap = el("div", null, { marginTop: "34px" });
  const mkRow = (k, v) => {
    const r = el("div", null, { display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: "13px 0", borderTop: "1px solid var(--rule-2)" });
    r.appendChild(el("div", "mono", { fontSize: "17px", letterSpacing: "0.14em", color: "var(--ink-3)" }, k));
    const val = el("div", "mono", { fontSize: "19px", color: "var(--ink)" }, v);
    r.appendChild(val); r._v = val;
    return r;
  };
  const rSections = mkRow("SECTIONS", "7 · measured at bar resolution");
  const rHook = mkRow("HOOK", "148.8s → 241.9s");
  rowsWrap.appendChild(rSections); rowsWrap.appendChild(rHook);

  const methodLabel = el("div", "mono", { marginTop: "30px", fontSize: "17px", letterSpacing: "0.22em", color: "var(--gold)" }, "METHOD · REQUIRED");
  const method = el("div", "mono", { marginTop: "12px", fontSize: "16.5px", lineHeight: "1.55", color: "var(--ink-2)", height: "250px", overflow: "hidden" });

  panel.appendChild(bpmLabel); panel.appendChild(bpm); panel.appendChild(bpmUnit);
  panel.appendChild(rowsWrap); panel.appendChild(methodLabel); panel.appendChild(method);
  root.appendChild(kick); root.appendChild(panel);

  const METHOD_TEXT = "audio_numpy: spectral-flux onset envelope @ 22050Hz/hop 256, joint tempo+phase comb fit over 328 beats → 79.97 BPM; bar phase from arrangement-change residue; sections at bar resolution.";

  const tTempo = CUE("tempo, sections");
  const tSections = CUE("sections, hook");
  const tHook = CUE("hook window");
  const tMethod = CUE("the method that produced it");

  const wide = { x: 0.14, y: 0.03, w: 0.66 };
  const onSections = { x: 0.16, y: 0.19, w: 0.42 };
  const onHook = { x: 0.165, y: 0.60, w: 0.40 };

  return (t) => {
    hideExtras(shot);
    const p = at(t, s.in, 0.9);
    rise(kick, at(t, s.in, 0.6));
    // The panel arrives with the number, not before it — an empty card holding the
    // right third of the frame for two seconds reads as a loading state.
    const ppanel = at(t, tTempo - 0.55, 0.6);
    panel.style.opacity = clamp(ppanel * 1.5);
    panel.style.transform = `translateX(${px(lerp(40, 0, easeOut(ppanel)))})`;

    let c;
    if (t < tHook) c = camLerp(wide, onSections, easeInOut(at(t, s.in, 2.0)));
    else c = camLerp(onSections, onHook, easeInOut(at(t, tHook, 1.4)));
    cam(shot, { x: c.x, y: c.y + 0.010 * easeInOut(at(t, s.in, s.out - s.in)), w: c.w });

    // The number arrives by counting, because it is a measurement and not a label.
    const pb = easeExpo(at(t, tTempo, 1.1));
    bpm.textContent = (79.97 * pb).toFixed(2);
    bpm.style.opacity = clamp(at(t, tTempo, 0.3) * 2);
    bpmLabel.style.opacity = bpmUnit.style.opacity = clamp(at(t, tTempo, 0.4) * 2);

    rise(rSections, at(t, tSections, 0.45));
    rise(rHook, at(t, tHook, 0.45));

    methodLabel.style.opacity = clamp(at(t, tMethod - 0.35, 0.4) * 2);
    typeOn(method, METHOD_TEXT, at(t, tMethod - 0.3, 2.6));
    method.style.opacity = clamp(at(t, tMethod - 0.35, 0.4) * 2);

    const ph = at(t, tHook + 0.2, 0.5);
    if (ph > 0) {
      hl(shot, "hook", { x: 0.174, y: 0.668, w: 0.556, h: 0.078 }, ph);
      tag(shot, "hook", { x: 0.174, y: 0.668 }, "hook of record · chorus 1", ph, null, 0, -46);
    }
  };
});

// ---- s3 · Then generate — the formats ------------------------------------------
scene("formats", (root, s) => {
  // Hands over to `copied` on the clause about the fan, rather than running to the end
  // of the sentence — otherwise both scenes are on screen at once.
  s.in = CUE("Then generate"); s.out = CUE("so a fan who sees one");

  const shot = makeShot("07-generate", { x: 96, y: 176, w: 1000, h: 728 });
  root.appendChild(shot);

  const kick = el("div", "kicker", { position: "absolute", left: "96px", top: "108px" }, "STEP 03 · GENERATE");
  root.appendChild(kick);

  const head = el("div", "head", { position: "absolute", left: "1160px", top: "150px", width: "680px", fontSize: "44px" });
  root.appendChild(head);

  // The four named outputs, each with the real asset that format produced.
  const tPerf = CUE("A performance clip");
  const tStill = CUE("A press still");
  const tDirect = CUE("The artist announcing");
  const tBack = CUE("Or a backdrop");

  const stack = el("div", null, { position: "absolute", left: "1160px", top: "250px", width: "700px", height: "700px" });
  root.appendChild(stack);

  const clipPerf = makeVideo("perf", { x: 0, y: 0, w: 300, h: 533 });
  const stillPress = makeStill(BROLL.stillA, { x: 330, y: 0, w: 300, h: 533 });
  const clipDirect = makeVideo("direct", { x: 0, y: 0, w: 300, h: 533 });
  const clipBack = makeVideo("backdrop", { x: 330, y: 0, w: 300, h: 533 });
  [clipPerf, stillPress, clipDirect, clipBack].forEach(n => stack.appendChild(n));

  const cap = el("div", "mono", { position: "absolute", left: "1160px", top: "812px", fontSize: "18px", color: "var(--ink-3)" });
  root.appendChild(cap);

  // Format cards on the captured page, in image coordinates.
  //
  // The "Performance clip" card is the selected one, so it carries the console's gold
  // outline in the screenshot itself. Its box was read straight off those pixels
  // (x 0.1854, y 0.2075, w 0.1802, h 0.0389) and the rest of the grid is stepped off it
  // at the measured 0.0415 row pitch — which is why these highlights sit on the cards
  // instead of near them.
  const COL1 = 0.1854, COL2 = 0.3770, CW = 0.1802, PITCH = 0.0415;
  const CARDS = {
    backdrop: { x: COL1, y: 0.1660, w: CW, h: 0.0360 },
    direct:   { x: COL2, y: 0.1660, w: CW, h: 0.0360 },
    perf:     { x: COL1, y: 0.2075, w: CW, h: 0.0389 },
    portrait: { x: COL2, y: 0.2075, w: CW, h: 0.0389 },
    voice:    { x: COL1, y: 0.1660 + 2 * PITCH, w: CW, h: 0.0350 },
  };

  const onGrid = { x: 0.155, y: 0.140, w: 0.44 };
  const onGridTight = { x: 0.163, y: 0.150, w: 0.41 };

  return (t) => {
    hideExtras(shot);
    cam(shot, camLerp(onGrid, onGridTight, easeInOut(at(t, s.in, s.out - s.in))));
    rise(kick, at(t, s.in, 0.5));

    // Each format lights when it is named, and stays lit.
    const lit = [
      [tPerf, "perf"], [tStill, "portrait"], [tDirect, "direct"], [tBack, "backdrop"],
    ];
    for (const [tc, key] of lit) {
      const p = at(t, tc, 0.38);
      if (p > 0) hl(shot, key, CARDS[key], p);
    }
    const pv = at(t, s.in + 0.4, 0.5);
    if (pv > 0) hl(shot, "voice", CARDS.voice, pv * 0.45);

    head.style.opacity = clamp(at(t, s.in, 0.6) * 1.6);
    head.innerHTML = t < tBack
      ? 'Whatever the release needs.'
      : 'Or a backdrop built to be <span style="color:var(--gold)">copied</span>.';

    // The asset for the format currently being named.
    const show = (tile, tc, dur) => {
      const p = at(t, tc, 0.45), q = 1 - at(t, tc + dur, 0.4);
      const vis = clamp(p) * clamp(q);
      tile.style.opacity = vis;
      tile.style.transform = `translateY(${px(lerp(28, 0, easeOut(p)))}) scale(${lerp(0.96, 1, easeOut(p))})`;
      tile.style.zIndex = vis > 0.02 ? 5 : 0;
      if (vis > 0.02) seekTile(tile, t - tc + 1.2);
      return vis;
    };

    show(clipPerf, tPerf, 1.35);
    show(stillPress, tStill, 1.5);
    show(clipDirect, tDirect, 2.4);
    const vb = show(clipBack, tBack, 30);
    if (vb > 0) clipBack.style.left = "0px";

    cap.style.opacity = 0;
    const captions = [[tPerf, "performance clip · sora-2"], [tStill, "press still · bria-fibo-edit"],
                      [tDirect, "direct address · sora-2"], [tBack, "backdrop loop · sora-2"]];
    for (const [tc, txt] of captions) {
      if (t >= tc && t < tc + 2.2) { cap.textContent = txt; cap.style.opacity = clamp(at(t, tc, 0.4)); }
    }
  };
});

// ---- s3b · a backdrop, copied ---------------------------------------------------
scene("copied", (root, s) => {

  const sub = el("div", "sub", { position: "absolute", left: "128px", top: "430px", width: "520px", fontSize: "23px" },
    "A format is a template, not a finished ad — the point is that it is obvious how to make your own.");
  root.appendChild(head); root.appendChild(sub);

  // One source tile on the left, a grid of copies fanning out on the right.
  const grid = el("div", null, { position: "absolute", left: "760px", top: "120px", width: "1060px", height: "840px" });
  root.appendChild(grid);

  const CW = 244, CH = 400, GX = 20, GY = 20;
  const tiles = [];
  // Four moving tiles and two stills — the copies a fan would make of one backdrop.
  const srcs = ["backdrop", BROLL.stillB, "extra", BROLL.stillA, "perf", "direct"];

      n.appendChild(c); if (i === 3) n._loop = c;

    const c = el("div", i === 0 ? "" : "mono", {
      width: COLS[i][1] + "px", fontSize: i === 0 ? "27px" : "20px", color: "var(--gold)",
    });

  const caption = el("div", "mono", { position: "absolute", left: "160px", top: "934px", fontSize: "21px", color: "var(--ink-3)", opacity: 0 },

  return (t) => {
    rise(kick, at(t, s.in, 0.5));

    });

    // The new row arrives cell by cell, left to right, as the line lands.
    const pa = at(t, tAdd - 0.3, 0.35);
    newRow.style.opacity = clamp(pa * 2);
    newRow.style.background = `rgba(245,185,64,${(0.10 * clamp(pa)).toFixed(3)})`;
    newCells.forEach((c, i) => {
      typeOn(c, c._txt, at(t, tAdd - 0.2 + i * 0.2, 0.3), i === newCells.length - 1);
    });
    caption.style.opacity = clamp(at(t, tAdd + 1.1, 0.6));
  };
});

<script>
// ---------------------------------------------------------------------------- driver

async function boot() {
  const res = await fetch("out/alignment.json");
  const data = await res.json();
  WORDS = data.words;
  indexWords();
  window.DURATION = data.duration;

  buildScenes();

  // Wait for every image to have real pixels before the first frame is taken.
  const imgs = Array.from(document.images).map(i => i.complete && i.naturalWidth
    ? null
    : new Promise(r => { i.onload = r; i.onerror = r; setTimeout(r, 20000); }));
  await Promise.all(imgs.filter(Boolean));

  window.READY = true;
}

/** Put the stage into its state at time `t`; resolve once its b-roll frames are decoded. */
window.SEEK = async function (t) {
  PENDING.length = 0;

  // Two slow, mutually prime periods, so the light never repeats a position within the
  // length of the film.
  bgfx.style.transform =
    `translate(${(Math.sin(t / 17) * 70).toFixed(2)}px, ${(Math.cos(t / 23) * 54).toFixed(2)}px)`;

  for (const s of SCENES) {
    const vis = t >= s.in - XF && t < s.out + XF;
    if (!vis) { s.root.style.opacity = 0; s.root.style.display = "none"; continue; }
    s.root.style.display = "block";
    // cross-dissolve at both ends
    const fin = clamp((t - (s.in - XF)) / XF);
    const fout = 1 - clamp((t - s.out) / XF);
    s.root.style.opacity = String(clamp(Math.min(fin, fout)));
    s.update(t);
  }
  // Only the b-roll frames this pass actually swapped are waited on; a tile already
  // showing the right frame costs nothing.
  await Promise.all(PENDING);
  return true;
};

boot();
</script>
