<!doctype html>
<meta charset="utf-8">
<title>10 · residency per row</title>
<link rel="stylesheet" href="../lib/scene.css">
<svg id="svg" viewBox="0 0 1920 1080"><g id="stage"></g></svg>
<script src="../lib/defs.js"></script>
<script src="../lib/scene.js"></script>
<script>
/* 10 · ONE TABLE, TWO CONTINENTS                                      21.0s
 * Over: "We're holding contact details for real people, and European law says
 *        where that data can live. Same table, same query: this row is in
 *        Virginia, this one is physically in Ireland."
 *        "Residency per row… Now lose a region. It keeps answering."
 *
 * The trap here is drawing two tables. The entire claim is that there is ONE
 * logical table whose rows sit in different places, so the table glyph at the
 * centre never splits, never duplicates, and never moves. Only the rows travel.
 *
 * A world map was the other option and it is worse: it makes the beat about
 * geography, when the beat is about a single table not caring about geography.
 */
const { win, ease, polar, arc, el, label, lerp, clamp01 } = SP;

const US = { deg: 250, name: 'us-east-1' };
const EU = { deg:  70, name: 'eu-west-1' };
let table, regions = {}, rows = [], q, qArc, downX, keeps;

function region(root, spec) {
  const p = polar(360, spec.deg);
  const g = el('g', {}, root);
  el('circle', { cx: p.x, cy: p.y, r: 96, class: 'wire thin', opacity: 0.55 }, g);
  el('circle', { cx: p.x, cy: p.y, r: 128, class: 'wire faint thin', opacity: 0.3 }, g);
  const cap = label(spec.name, p.x, p.y + 168, { size: 26 }, root);
  return { g, p, cap, spec };
}

SP.Scene.define({
  dur: 21,

  setup(root) {
    GROOVES.setAttribute('opacity', 0.28);

    regions.us = region(root, US);
    regions.eu = region(root, EU);

    // ONE table. Centre of frame, never duplicated.
    table = el('g', {}, root);
    el('rect', { x: 860, y: 470, width: 200, height: 140, rx: 14, class: 'wire fat' }, table);
    el('line', { x1: 860, y1: 512, x2: 1060, y2: 512, class: 'wire thin' }, table);
    el('line', { x1: 860, y1: 554, x2: 1060, y2: 554, class: 'wire thin' }, table);
    label('contact_route', 960, 660, { size: 27 }, root);

    // two rows, which are the things that move
    [['us', 496], ['eu', 580]].forEach(([where, y]) => {
      rows.push({
        where,
        node: el('rect', { x: 878, y: y - 14, width: 164, height: 28, rx: 6,
                           class: 'fill', opacity: 0.85 }, root),
      });
    });

    q = el('circle', { r: 11, class: 'fill good', opacity: 0 }, root);
    qArc = el('path', { class: 'wire good', fill: 'none', opacity: 0 }, root);

    const p = regions.us.p;
    downX = el('path', {
      d: `M ${p.x - 46} ${p.y - 46} l 92 92 M ${p.x + 46} ${p.y - 46} l -92 92`,
      class: 'wire bad fat', opacity: 0,
    }, root);
    keeps = label('still answering', 960, 962, { size: 34, cls: 'good say' }, root);
    keeps.setAttribute('opacity', 0);
    SP.scrim(960, 950, 360, 78, root);
    root.appendChild(keeps);
  },

  frame(t) {
    // 1 · the two rows leave the table for their own regions      2 – 7
    rows.forEach((r, i) => {
      const u = ease.inOut(win(t, 2.2 + i * 1.5, 1.7));
      const home = { x: 878, y: 482 + i * 84 };
      const dst = regions[r.where].p;
      r.node.setAttribute('x', lerp(home.x, dst.x - 82, u).toFixed(1));
      r.node.setAttribute('y', lerp(home.y, dst.y - 14, u).toFixed(1));
      r.node.style.fill = u > 0.6 ? (r.where === 'eu' ? 'var(--carrier)' : 'var(--phosphor-bright)')
                                  : 'var(--phosphor)';
    });

    // the tether: each row is still part of the one table
    ['us', 'eu'].forEach((k) => {
      regions[k].cap.setAttribute('opacity', ease.out(win(t, 3.0, 0.8)));
    });

    // 2 · a query runs, reaching both                              8 – 12
    const sweep = win(t, 8.2, 3.2);
    if (sweep > 0 && sweep < 1) {
      qArc.setAttribute('opacity', 0.85);
      qArc.setAttribute('d', arc(360, EU.deg, EU.deg + 340 * ease.inOut(sweep)));
    } else qArc.setAttribute('opacity', sweep >= 1 ? 0.35 : 0);

    // 3 · lose a region                                           13 – 17
    const down = ease.out(win(t, 13.2, 0.6));
    downX.setAttribute('opacity', down * 0.95);
    regions.us.g.setAttribute('opacity', lerp(1, 0.22, down));
    regions.us.cap.setAttribute('opacity', lerp(1, 0.22, down));
    rows[0].node.setAttribute('opacity', lerp(0.85, 0.16, down));

    // 4 · and it keeps answering                                  16 – 21
    const alive = win(t, 15.6, 4.4);
    if (alive > 0) {
      const orbit = EU.deg - 40 + 80 * Math.sin(alive * Math.PI * 2);
      const p = polar(360, orbit);
      q.setAttribute('cx', p.x); q.setAttribute('cy', p.y);
      q.setAttribute('opacity', 0.95);
      keeps.setAttribute('opacity', ease.out(win(t, 16.6, 0.7)));
    }
  },
});
</script>
