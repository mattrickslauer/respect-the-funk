schema: rtf.edit/v2
id: nate-test
format: promise-payoff
song: losing-sleep
cast:
- nate-hook
title: nate-hook — found hook, congruent payoff
intent: 'Found dialogue makes the promise; the payoff inverts the world it was said in. Hook line: "Yo,
  this has to be the craziest crew ever."'
hook:
  clip: nate-hook
  t_in: 0
  t_out: 7200
congruence:
  from: A casual park scene with a few ordinary pigeons.
  to: A park scene where pigeons exhibit impossible, grand, and intense behaviors, fulfilling the 'craziest
    crew' promise.
  invariant:
  - 'The park setting: lush green grassy verge, trees, stone wall, distant street, and general outdoor
    light conditions.'
  - The pigeons as the central figures, retaining their natural appearance (unless inverted by an axis).
  - The photographic medium, high-resolution, vertical framing, and casual phone camera aesthetic.
  inverted:
    ordinary -> impossible: Pigeons' behavior changes from mundane to extraordinary or supernatural feats.
    small -> huge: The scale of pigeons' actions or impact, from negligible to significant or monumental.
    still -> moving: Pigeons' activity level, from static or slow to dynamic, fast-paced, and complex
      motion.
    empty -> crowded: The number of pigeons or the density of their collective activity, from sparse to
      overwhelming.
    day -> night: The time of day and associated lighting, from bright daylight to various night-time
      scenarios.
prompt:
  characters_block: '{nate-hook.prompt_description}'
  identity: Each image depicts the same grassy park verge, trees, stone wall, and distant street, maintaining
    a photographic, vertical aspect, focusing on pigeons as the central figures while varying their actions
    and environment.
carousel:
  items:
  - still: pay-01
    hits:
    - day -> night
    intensity: 2
    prompt: A group of common city pigeons on a lush green grassy verge, near trees, a stone wall, and
      a street in the background, captured in a photographic, high-resolution, vertical format. The scene
      is now at dusk, with warm, fading light and long shadows. Pigeons are silhouetted against the twilight
      sky, perched on branches and the wall.
  - still: pay-02
    hits:
    - ordinary -> impossible
    intensity: 1
    prompt: A group of common city pigeons on a lush green grassy verge, near trees, a stone wall, and
      a street in the background, captured in a photographic, high-resolution, vertical format. Three
      pigeons are stacked neatly on top of each other, forming a small, stable pyramid, looking slightly
      bemused.
  - still: pay-03
