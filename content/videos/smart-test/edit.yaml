schema: rtf.edit/v2
id: smart-test
format: promise-payoff
song: losing-sleep
cast: []
title: interview-answer — found hook, congruent payoff
intent: 'Found dialogue makes the promise; the payoff inverts the world it was said in. Hook line: "Are
  you smart?"'
hook:
  clip: interview-answer
  t_in: 0
  t_out: 4500
congruence:
  from: A casual outdoor street interview under bright daylight, questioning intelligence.
  to: An epic, impossible, and overwhelming display of cosmic understanding and mental power, witnessed
    under various extreme conditions.
  invariant:
  - The figure of a young man (seen from behind or as a silhouette) in a beige t-shirt with a graphic
    design
  - A microphone held by a dark-skinned hand, positioned near the figure
  - The general medium close-up framing and perspective
  - The street/storefront architectural geometry (even if transformed)
  - Photographic medium with a realistic style
  inverted:
    Impossible (Intellect): Ordinary intelligence -> Cosmic, impossible understanding
    Night/Cosmic: Bright daylight -> Dark, star-filled, or extreme atmospheric conditions
    Dynamic/Energetic: Calm, static interview -> Intense, active, or supercharged mental/environmental
      states
    Crowded/Complex (Information): Relatively simple background -> Teeming with data, patterns, or cosmic
      structures
    Hot/Intense: Neutral ambient temperature -> Superheated, electrified, or explosively energetic
prompt:
  characters_block: ''
  identity: Each image portrays the figure of a young man (seen from behind or as a silhouette) in a beige
    graphic t-shirt, with a microphone held by a dark-skinned hand positioned near him, within a dynamically
    inverted and information-dense environment, rendered in a consistent medium close-up, realistic photographic
    style, and naturalistic color palette.
