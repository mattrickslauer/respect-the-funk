schema: rtf.edit/v2
id: storytime-test
format: promise-payoff
song: losing-sleep
cast:
- storytime
title: storytime — found hook, congruent payoff
intent: 'Found dialogue makes the promise; the payoff inverts the world it was said in. Hook line: "are
  you gonna scream?"'
hook:
  clip: storytime
  t_in: 0
  t_out: 4500
congruence:
  from: A worried cartoon figure faces an ambiguous, egg-shaped character on a stark white background.
  to: The same cartoon figures are engulfed in a vibrant, chaotic, and joyfully impossible world.
  invariant:
  - 2D cartoon art style with thick black outlines, flat colors, and simple shading
  - The character with brown hair, red and white striped shirt, and black pants/shoes
  - The egg-shaped character with an orange beak and black spiky 'mask'
  - Close-up framing that centers on the characters and cuts off body parts
  - The general positioning of the two main figures relative to each other
  inverted:
    motion: stillness -> hyperactive movement
    reality: ordinary -> surreal and impossible scenarios
    space: empty white background -> densely crowded and overwhelming environments
    order: clean and minimal -> chaotic and exploding with elements
    emotion: apprehension -> unbridled exhilaration and joy
prompt:
  characters_block: '{storytime.prompt_description}'
  identity: Each image depicts the brown-haired character and the egg-shaped character in the same relative
    positions and attire, but the world around them is transformed by hyperactive movement, impossible
    events, dense crowding, exploding chaos, and overwhelming exhilaration, all rendered in the hook's
    distinct 2D cartoon style with thick black outlines and flat colors.
