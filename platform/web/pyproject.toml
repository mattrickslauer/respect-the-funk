[project]
name = "spindle"
version = "0.1.0"
description = "The platform console — artists and, later, everything that hangs off them."
requires-python = ">=3.12"

# Deliberately short. Every dependency here is one that has to be bundled into a
# Lambda zip, and the zip is the cold-start cost.
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",   # form posts
    "mangum>=0.19",              # ASGI -> Lambda
]

[project.optional-dependencies]
dev = ["uvicorn[standard]>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spindle*"]
