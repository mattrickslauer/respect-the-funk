<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Platform{% endblock %} — Respect the Funk</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <style>
    /* Structural on purpose. This is the wireframe stage: the job of the CSS
       here is to make hierarchy and state legible, not to be the visual design.
       Type, spacing and the light/dark split are settled; colour and character
       are not, and are deliberately left for the design pass. */
    :root {
      --bg: #fbfbfa;      --panel: #ffffff;  --ink: #1a1a19;
      --muted: #6b6b66;   --line: #e2e1dd;   --accent: #1a1a19;
      --danger: #a3271f;  --radius: 6px;
      /* The one hue the wireframe earns. "This is actually running" versus "this is
         written down" is the single distinction the fleet and substrate pages exist to
         make, and muted-against-muted cannot carry it. Everything else stays greyscale
         until the design pass. */
      --live: #2f6b46;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;    --panel: #1c1c1a;  --ink: #ececea;
        --muted: #97968f; --line: #2e2e2b;   --accent: #ececea;
        --danger: #e0796f;
        --live: #6cc38d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--line);
    }
    header .mark { font-weight: 650; letter-spacing: -0.01em; }
    header .tenant {
      font-size: 12px; color: var(--muted); border: 1px solid var(--line);
      padding: 1px 7px; border-radius: 100px;
    }
    header nav { margin-left: auto; display: flex; gap: 1rem; align-items: center; }
    main { max-width: 940px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; letter-spacing: -0.015em; }
    .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 1.75rem; }
    a { color: inherit; }
    .bar { display: flex; gap: .75rem; align-items: center; margin-bottom: 1rem; }
    input[type=text], input[type=password], input[type=search], select {
      font: inherit; padding: .5rem .65rem; border: 1px solid var(--line);
      border-radius: var(--radius); background: var(--panel); color: var(--ink);
      min-width: 0;
    }
    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 1px;
    }
    .btn {
      font: inherit; padding: .5rem .85rem; border-radius: var(--radius);
      border: 1px solid var(--line); background: var(--panel); color: var(--ink);
      cursor: pointer; text-decoration: none; display: inline-block;
    }
    .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .btn.danger  { color: var(--danger); border-color: var(--line); }
    .btn:disabled, .btn[aria-disabled=true] { opacity: .45; cursor: not-allowed; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: .7rem .9rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
    tbody tr:last-child td { border-bottom: 0; }
    .type-tag {
      font-size: 11.5px; border: 1px solid var(--line); color: var(--muted);
      padding: 1px 8px; border-radius: 100px;
    }
    .empty { padding: 2.5rem 1rem; text-align: center; color: var(--muted); font-size: 14px; }
    .field { display: grid; gap: .3rem; margin-bottom: 1.1rem; max-width: 420px; }
    .field label { font-size: 12.5px; color: var(--muted); }
    .field .hint { font-size: 12px; color: var(--muted); }
    .notice {
      border: 1px solid var(--line); background: var(--panel); padding: .7rem .9rem;
      border-radius: var(--radius); font-size: 13.5px; color: var(--muted);
      margin-bottom: 1.5rem;
    }
    form.inline { display: inline; }

    /* --- design surfaces: the fleet, the substrate, the research shape ------------
       These pages render a specification, not data. Everything on them is either
       running or written down, and the pill is what says which. */
    .pill {
      font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
      font-weight: 650; padding: 2px 8px; border-radius: 100px;
      border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
    }
    .pill.live    { color: var(--live); border-color: var(--live); }
    .pill.next    { color: var(--ink); border-color: var(--ink); }
    .pill.planned { opacity: .75; }
    .mono {
      font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--muted);
    }
    td .mono { white-space: nowrap; }
    .wrap td, .wrap th { white-space: normal; }
    .lede {
      border-left: 2px solid var(--line); padding: .1rem 0 .1rem 1rem;
      margin: 0 0 2rem; color: var(--muted); font-size: 14px; max-width: 62ch;
    }
    .lede strong { color: var(--ink); font-weight: 600; }
    h2 {
      font-size: 1rem; letter-spacing: -0.01em; margin: 2.5rem 0 .3rem;
      display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap;
    }
    h2 .cite { font: inherit; font-size: 12px; font-weight: 400; color: var(--muted); }
    .say { color: var(--muted); font-size: 13.5px; margin: 0 0 1rem; max-width: 68ch; }
    .tally { display: flex; gap: 1.25rem; flex-wrap: wrap; margin: 0 0 1.75rem; }
    .tally div { font-size: 13px; color: var(--muted); }
    .tally b { color: var(--ink); font-size: 1.35rem; font-weight: 650; display: block;
               letter-spacing: -0.02em; }
    .yes { color: var(--live); font-weight: 650; }
    .no  { color: var(--muted); }
    nav a[aria-current=page] { font-weight: 650; }
  </style>
</head>
<body>
  <header>
    <span class="mark">Respect the Funk</span>
    <span class="tenant">{{ tenant_slug }}</span>
    <nav>
      {# `nav_here` is set by the pages that have a nav entry; unset elsewhere, which is
         why this is a comparison and not a truthiness test. #}
      <a href="/artists"   {% if nav_here == 'artists'   %}aria-current="page"{% endif %}>Artists</a>
      <a href="/fleet"     {% if nav_here == 'fleet'     %}aria-current="page"{% endif %}>Fleet</a>
      <a href="/substrate" {% if nav_here == 'substrate' %}aria-current="page"{% endif %}>Substrate</a>
      {% if principal.may_write %}
        <form class="inline" method="post" action="/signout">
          <button class="btn" type="submit">Sign out</button>
        </form>
      {% else %}
        <a class="btn" href="/signin">Sign in</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
