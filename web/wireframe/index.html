<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RemixKit — Artist console wireframe</title>
<style>
/* Drafting-sheet vernacular, on purpose.
 *
 * A wireframe that looks finished gets critiqued as a finished thing — people argue
 * about colour instead of structure. So: hairlines not shadows, hatching not imagery,
 * bars not lorem, and exactly one accent.
 *
 * Two voices carry the whole design. Mono is the machine layer — primitive names,
 * field names, bindings, routes: everything that came from the spec. Sans is the
 * content layer — the placeholder shapes standing in for what a person will read.
 * Keeping them visually distinct is what makes the wireframe legible as a *system*
 * rather than a drawing.
 */

:root {
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --paper: #e9edf1;
  --plate: #f8fafb;
  --sunk:  #eef2f6;
  --ink:   #18212c;
  --muted: #64738799;
  --label: #647387;
  --faint: #94a2b3;
  --rule:  #ccd5de;
  --hair:  #dde4ea;
  --accent:#2f6f8f;
  --accent-soft: #2f6f8f1a;
  --ok:    #45785a;
  --gap:   #8f6b1c;
  --warn:  #9c5330;

  --step-0: 0.6875rem;  /* 11px — machine labels */
  --step-1: 0.75rem;    /* 12px */
  --step-2: 0.8125rem;  /* 13px — body */
  --step-3: 0.9375rem;  /* 15px */
  --step-4: 1.1875rem;  /* 19px */
  --step-5: 1.625rem;   /* 26px */

  --gap-tight: 6px;
  --gap-base: 14px;
  --gap-loose: 26px;

  --rail: 232px;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0f1319;
    --plate: #161b23;
    --sunk:  #12171e;
    --ink:   #ccd6e0;
    --muted: #7e8c9e99;
    --label: #8593a5;
    --faint: #5a6878;
    --rule:  #2a333f;
    --hair:  #212933;
    --accent:#6fb2d2;
    --accent-soft: #6fb2d21f;
    --ok:    #6d9e7c;
    --gap:   #bd9741;
    --warn:  #c67d55;
  }
}

:root[data-theme="dark"] {
  --paper: #0f1319; --plate: #161b23; --sunk: #12171e;
  --ink: #ccd6e0; --muted: #7e8c9e99; --label: #8593a5; --faint: #5a6878;
  --rule: #2a333f; --hair: #212933;
  --accent: #6fb2d2; --accent-soft: #6fb2d21f;
  --ok: #6d9e7c; --gap: #bd9741; --warn: #c67d55;
}

:root[data-theme="light"] {
  --paper: #e9edf1; --plate: #f8fafb; --sunk: #eef2f6;
  --ink: #18212c; --muted: #64738799; --label: #647387; --faint: #94a2b3;
  --rule: #ccd5de; --hair: #dde4ea;
  --accent: #2f6f8f; --accent-soft: #2f6f8f1a;
  --ok: #45785a; --gap: #8f6b1c; --warn: #9c5330;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--step-2);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------------------------------------------------------------- shell */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }

.rail {
  border-right: 1px solid var(--rule);
  background: var(--plate);
  padding: 22px 0 40px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}

.rail__mark { padding: 0 20px 20px; border-bottom: 1px solid var(--hair); }
.rail__product { font-family: var(--mono); font-size: var(--step-3); letter-spacing: -0.01em; }
.rail__surface { font-family: var(--mono); font-size: var(--step-0); color: var(--label); text-transform: uppercase; letter-spacing: 0.09em; margin-top: 3px; }

.rail__group { padding: 18px 20px 0; }
.rail__grouplabel { font-family: var(--mono); font-size: var(--step-0); text-transform: uppercase; letter-spacing: 0.09em; color: var(--faint); }
.rail__grouphint { font-size: var(--step-1); color: var(--label); margin-top: 2px; line-height: 1.35; }

.rail__list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }

.rail__link {
  display: block; width: 100%; text-align: left;
  font-family: var(--mono); font-size: var(--step-1);
  background: none; border: 0; border-left: 2px solid transparent;
  color: var(--ink); padding: 5px 10px; cursor: pointer;
}
.rail__link:hover { background: var(--sunk); }
.rail__link[aria-current="true"] { border-left-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.rail__controls { padding: 22px 20px 0; margin-top: 14px; border-top: 1px solid var(--hair); display: flex; flex-direction: column; gap: 8px; }

.toggle {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: var(--step-0); color: var(--label);
  text-transform: uppercase; letter-spacing: 0.07em; cursor: pointer;
  background: none; border: 0; padding: 0; text-align: left;
}
.toggle__box { width: 11px; height: 11px; border: 1px solid var(--rule); flex: none; }
.toggle[aria-pressed="true"] .toggle__box { background: var(--accent); border-color: var(--accent); }
.toggle[aria-pressed="true"] { color: var(--ink); }

/* ---------------------------------------------------------------- plate */
.main { padding: 30px 34px 90px; max-width: 1180px; }

.titleblock {
  border: 1px solid var(--rule); background: var(--plate);
  display: grid; grid-template-columns: 1fr auto;
}
.titleblock__body { padding: 16px 18px; }
.titleblock__name { font-size: var(--step-5); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.titleblock__purpose { color: var(--label); margin: 6px 0 0; max-width: 62ch; font-size: var(--step-3); line-height: 1.45; }
.titleblock__meta { border-left: 1px solid var(--rule); padding: 16px 18px; display: flex; flex-direction: column; gap: 7px; min-width: 210px; }
.titleblock__row { font-family: var(--mono); font-size: var(--step-0); display: flex; gap: 8px; }
.titleblock__key { color: var(--faint); text-transform: uppercase; letter-spacing: 0.07em; }
.titleblock__val { color: var(--ink); word-break: break-all; }

.sheet { margin-top: var(--gap-loose); display: flex; flex-direction: column; gap: var(--gap-loose); }

/* ---------------------------------------------------------------- blocks */
.b { position: relative; min-width: 0; }
.b--col, .b--row, .b--grid { display: flex; min-width: 0; }
.b--col { flex-direction: column; }
.b--row { flex-direction: row; align-items: flex-start; }
.b--grid { display: grid; }
.gap-none { gap: 0; } .gap-tight { gap: var(--gap-tight); } .gap-base { gap: var(--gap-base); } .gap-loose { gap: var(--gap-loose); }

.region { border: 1px solid var(--rule); background: var(--plate); }
.region__head { padding: 11px 14px; border-bottom: 1px solid var(--hair); display: flex; flex-direction: column; gap: 2px; }
.region__title { font-family: var(--mono); font-size: var(--step-1); text-transform: uppercase; letter-spacing: 0.08em; }
.region__hint { font-size: var(--step-1); color: var(--label); max-width: 74ch; line-height: 1.4; }
.region__body { padding: 14px; display: flex; flex-direction: column; gap: var(--gap-base); }

.card { border: 1px solid var(--hair); background: var(--sunk); }
.card__title { font-family: var(--mono); font-size: var(--step-0); text-transform: uppercase; letter-spacing: 0.08em; color: var(--label); padding: 8px 12px; border-bottom: 1px solid var(--hair); }
.card__body { padding: 12px; display: flex; flex-direction: column; gap: var(--gap-base); }

/* placeholder bars — content that does not exist yet, and should not pretend to */
.bar { height: 8px; background: var(--rule); }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bars .bar:last-child { width: 62%; }
.ph { display: flex; flex-direction: column; gap: 5px; }
.ph__label { font-family: var(--mono); font-size: var(--step-0); color: var(--faint); }

/* hatching stands in for imagery; it reads as "not a decision yet" at any size */
.hatch {
  background-color: var(--sunk);
  background-image: repeating-linear-gradient(45deg,
    var(--hair) 0, var(--hair) 1px, transparent 1px, transparent 7px);
  border: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: center;
}
.hatch__note { font-family: var(--mono); font-size: var(--step-0); color: var(--faint); background: var(--plate); padding: 2px 6px; border: 1px solid var(--hair); text-align: center; max-width: 88%; }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--hair); }
table.t { border-collapse: collapse; width: 100%; font-size: var(--step-1); }
table.t th {
  font-family: var(--mono); font-size: var(--step-0); font-weight: 500; text-align: left;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--label);
  padding: 7px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; background: var(--sunk);
}
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--hair); }
table.t tr:last-child td { border-bottom: 0; }
.t__kind { font-family: var(--mono); font-size: var(--step-0); color: var(--faint); text-transform: none; letter-spacing: 0; }
.cell { height: 8px; background: var(--rule); width: 76%; }
.cell--num { width: 38%; margin-left: auto; }
.cell--enum { height: 14px; width: 54px; border: 1px solid var(--rule); background: transparent; }
.cell--bool { height: 10px; width: 10px; border: 1px solid var(--rule); background: transparent; }

/* forms — inputs are shapes, not controls; nothing here accepts input */
.fields { display: grid; gap: 11px; }
.fields--two-up { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field__label { font-family: var(--mono); font-size: var(--step-0); color: var(--label); display: flex; align-items: baseline; gap: 6px; }
.field__req { color: var(--warn); }
.field__type { color: var(--faint); margin-left: auto; }
.input { border: 1px solid var(--rule); background: var(--sunk); height: 26px; }
.input--list, .input--map, .input--object { height: 44px; }
.input--bool { height: 14px; width: 14px; }
.input--enum { height: 26px; width: 130px; }

/* read-only detail */
.detail { display: grid; gap: 9px 20px; }
.detail__row { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.detail__key { font-family: var(--mono); font-size: var(--step-0); color: var(--label); }
.detail__val { height: 8px; background: var(--rule); width: 70%; }

/* stats — summary before detail */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.stat { background: var(--plate); padding: 11px 13px; display: flex; flex-direction: column; gap: 5px; }
.stat__val { height: 16px; width: 46px; background: var(--rule); }
.stat__label { font-size: var(--step-1); }
.stat__src { font-family: var(--mono); font-size: var(--step-0); color: var(--faint); line-height: 1.35; }

/* actions */
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions--right { justify-content: flex-end; }
.btn { font-family: var(--mono); font-size: var(--step-1); padding: 5px 12px; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: default; }
.btn--primary { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.btn--danger { border-color: var(--warn); color: var(--warn); }

/* state — encoded in form as well as text */
.banner { border: 1px solid var(--rule); border-left-width: 3px; padding: 9px 12px; display: flex; flex-direction: column; gap: 3px; background: var(--sunk); }
.banner__tone { font-family: var(--mono); font-size: var(--step-0); text-transform: uppercase; letter-spacing: 0.08em; }
.banner__src { font-size: var(--step-1); color: var(--label); }
.banner--info { border-left-color: var(--accent); } .banner--info .banner__tone { color: var(--accent); }
.banner--ok   { border-left-color: var(--ok); }     .banner--ok .banner__tone { color: var(--ok); }
.banner--gap  { border-left-color: var(--gap); }    .banner--gap .banner__tone { color: var(--gap); }
.banner--warn { border-left-color: var(--warn); }   .banner--warn .banner__tone { color: var(--warn); }

.empty { border: 1px dashed var(--rule); padding: 18px; text-align: center; display: flex; flex-direction: column; gap: 7px; align-items: center; }
.empty__msg { color: var(--label); font-size: var(--step-1); }

.slot { border: 1px dashed var(--gap); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.slot__name { font-family: var(--mono); font-size: var(--step-0); text-transform: uppercase; letter-spacing: 0.08em; color: var(--gap); }
.slot__reason { font-size: var(--step-1); color: var(--label); max-width: 72ch; }

.repeat { border-left: 2px solid var(--hair); padding-left: 12px; display: flex; flex-direction: column; gap: 9px; }
.repeat__mark { font-family: var(--mono); font-size: var(--step-0); color: var(--faint); }

/* ---------------------------------------------------------------- annotation layer */
.tag {
  position: absolute; top: 0; right: 0; z-index: 2;
  font-family: var(--mono); font-size: 9px; line-height: 1.5;
  letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--accent); background: var(--plate);
  border: 1px solid var(--accent); border-right: 0; border-top: 0;
  padding: 1px 5px; pointer-events: none; white-space: nowrap;
}
.note {
  border-left: 2px solid var(--accent); background: var(--accent-soft);
  padding: 7px 11px; font-size: var(--step-1); color: var(--ink);
  max-width: 76ch; line-height: 1.45;
}
[data-annotations="off"] .tag,
[data-annotations="off"] .note { display: none; }
[data-annotations="on"] .b > .region,
[data-annotations="on"] .b > .card { outline: 1px dashed transparent; }

/* ---------------------------------------------------------------- reference views */
.ref { display: flex; flex-direction: column; gap: var(--gap-base); }
.ref__item { border: 1px solid var(--rule); background: var(--plate); padding: 12px 14px; }
.ref__name { font-family: var(--mono); font-size: var(--step-2); color: var(--accent); }
.ref__summary { color: var(--label); font-size: var(--step-1); margin-top: 3px; max-width: 74ch; }
.ref__props { font-family: var(--mono); font-size: var(--step-0); color: var(--faint); margin-top: 7px; word-break: break-word; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.chip { font-family: var(--mono); font-size: var(--step-0); border: 1px solid var(--hair); padding: 1px 6px; color: var(--label); }
.chip--req { border-color: var(--warn); color: var(--warn); }
.chip--inh { border-style: dashed; }

.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: var(--gap-base); }
.legend__item { display: flex; flex-direction: column; gap: 5px; }
.legend__label { font-family: var(--mono); font-size: var(--step-0); color: var(--label); text-transform: uppercase; letter-spacing: 0.07em; }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; }
  .main { padding: 20px 16px 60px; }
  .titleblock { grid-template-columns: 1fr; }
  .titleblock__meta { border-left: 0; border-top: 1px solid var(--rule); }
  .b--row { flex-direction: column; }
  .b--row > .b { width: 100% !important; }
}

@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: settle 0.18s ease-out; }
  @keyframes settle { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
}

</style>

<script>
/* The renderer.
 *
 * One recursive walk over the resolved model. There is no per-screen code anywhere in
 * this file and there must never be: every screen is data, and the only thing that
 * varies between them is the tree they carry. Adding a screen touches no JavaScript.
 *
 * Adding a *primitive* touches exactly two places — a declaration in
 * spec/primitives.json, so the build can validate it, and an entry in DRAW below, so
 * it can be drawn. Nothing else in the system needs to know it exists.
 */
(function () {
  "use strict";

  var MODEL = JSON.parse(document.getElementById("model").textContent);
  var state = {
    view: MODEL.screens.length ? MODEL.screens[0].id : "ref:primitives",
    annotations: true
  };

  /* -------------------------------------------------------------- dom helpers */
  function el(tag, props) {
    var node = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (key) {
      var value = props[key];
      if (value === null || value === undefined || value === false) return;
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key === "style") node.setAttribute("style", value);
      else if (key.slice(0, 2) === "on") node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : value);
    });
    for (var i = 2; i < arguments.length; i++) add(node, arguments[i]);
    return node;
  }

  function add(parent, child) {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) { child.forEach(function (c) { add(parent, c); }); return; }
    parent.appendChild(child.nodeType ? child : document.createTextNode(String(child)));
  }

  function bars(n, label) {
    var rows = [];
    for (var i = 0; i < (n || 1); i++) rows.push(el("div", { class: "bar" }));
    return el("div", { class: "ph" },
      label ? el("div", { class: "ph__label", text: label }) : null,
      el("div", { class: "bars" }, rows));
  }

  function hatch(ratio, note) {
    var parts = String(ratio || "16:9").split(":");
    var pct = (Number(parts[1]) / Number(parts[0])) * 100;
    return el("div", {
      class: "hatch",
      style: "aspect-ratio:" + parts[0] + "/" + parts[1] + ";min-height:" + Math.min(pct, 60) + "px"
    }, note ? el("span", { class: "hatch__note", text: note }) : null);
  }

  function fieldsOf(node) { return node.binding ? node.binding.fields : []; }

  /* -------------------------------------------------------------- primitives */
  var DRAW = {
    col: function (n) { return el("div", { class: "b b--col " + gap(n) }, kids(n)); },
    row: function (n) {
      var weights = n.weights || [];
      var box = el("div", { class: "b b--row " + gap(n) });
      (n.children || []).forEach(function (child, i) {
        var wrapped = el("div", { class: "b", style: "flex:" + (weights[i] || 1) + " 1 0;min-width:0" }, draw(child));
        box.appendChild(wrapped);
      });
      return box;
    },
    grid: function (n) {
      return el("div", {
        class: "b b--grid " + gap(n),
        style: "grid-template-columns:repeat(auto-fit,minmax(" + (n.min || 200) + "px,1fr))"
      }, kids(n));
    },

    region: function (n) {
      return el("section", { class: "region" },
        el("header", { class: "region__head" },
          el("h2", { class: "region__title", text: n.title || "Region" }),
          n.hint ? el("p", { class: "region__hint", text: n.hint }) : null),
        el("div", { class: "region__body" }, kids(n)));
    },

    card: function (n) {
      return el("div", { class: "card" },
        n.title ? el("div", { class: "card__title", text: n.title }) : null,
        el("div", { class: "card__body" }, kids(n)));
    },

    table: function (n) {
      var fields = fieldsOf(n);
      var head = el("tr", {}, fields.map(function (f) {
        return el("th", {}, f.name, el("div", { class: "t__kind", text: f.kind }));
      }));
      var body = [];
      for (var r = 0; r < (n.rows || 3); r++) {
        body.push(el("tr", {}, fields.map(function (f) {
          return el("td", {}, el("div", { class: "cell " + cellMod(f.kind) }));
        })));
      }
      return el("div", { class: "tablewrap" },
        el("table", { class: "t" }, el("thead", {}, head), el("tbody", {}, body)));
    },

    form: function (n) {
      return el("div", { class: "b b--col gap-base" },
        el("div", { class: "fields fields--" + (n.layout || "stacked") },
          fieldsOf(n).map(function (f) {
            return el("label", { class: "field" },
              el("span", { class: "field__label" },
                f.name,
                f.required ? el("span", { class: "field__req", text: "required" }) : null,
                el("span", { class: "field__type", text: f.kind })),
              el("div", { class: "input input--" + f.kind }));
          })),
        n.submit ? el("div", { class: "actions" }, el("span", { class: "btn btn--primary", text: n.submit })) : null);
    },

    detail: function (n) {
      return el("div", {
        class: "detail",
        style: "grid-template-columns:repeat(" + (n.columns || 2) + ",minmax(0,1fr))"
      }, fieldsOf(n).map(function (f) {
        return el("div", { class: "detail__row" },
          el("span", { class: "detail__key", text: f.name }),
          el("div", { class: "detail__val" }));
      }));
    },

    repeat: function (n) {
      var out = [el("div", { class: "repeat__mark", text: "repeats per " + (n.of || "record") + " — " + (n.count || 3) + " shown" })];
      for (var i = 0; i < (n.count || 3); i++) out.push(kids(n));
      return el("div", { class: "repeat" }, out);
    },

    gallery: function (n) {
      var tiles = [];
      for (var i = 0; i < (n.count || 4); i++) tiles.push(hatch(n.ratio || "9:16", n.ratio || null));
      return el("div", { class: "b b--col gap-tight" },
        el("div", { class: "gallery" }, tiles),
        n.caption ? el("div", { class: "ph__label", text: n.caption }) : null);
    },

    media: function (n) { return hatch(n.ratio || "16:9", (n.kind || "media") + (n.caption ? " — " + n.caption : "")); },

    stats: function (n) {
      return el("div", { class: "stats" }, (n.items || []).map(function (item) {
        return el("div", { class: "stat" },
          el("div", { class: "stat__val" }),
          el("div", { class: "stat__label", text: item.label }),
          el("div", { class: "stat__src", text: item.source }));
      }));
    },

    actions: function (n) {
      return el("div", { class: "actions" + (n.align === "right" ? " actions--right" : "") },
        (n.items || []).map(function (item) {
          return el("span", { class: "btn" + (item.kind ? " btn--" + item.kind : ""), text: item.label });
        }));
    },

    tabs: function (n) {
      return el("div", { class: "b b--col gap-base" },
        el("div", { class: "actions" }, (n.items || []).map(function (t, i) {
          return el("span", { class: "btn" + (i === 0 ? " btn--primary" : ""), text: t.label });
        })),
        (n.items && n.items[0] ? (n.items[0].children || []).map(draw) : null));
    },

    filters: function (n) {
      return el("div", { class: "actions" }, fieldsOf(n).map(function (f) {
        return el("span", { class: "btn", text: f.name + " ▾" });
      }));
    },

    banner: function (n) {
      var tone = n.tone || "info";
      return el("div", { class: "banner banner--" + tone },
        el("div", { class: "banner__tone", text: tone }),
        el("div", { class: "banner__src", text: n.source || "" }));
    },

    empty: function (n) {
      return el("div", { class: "empty" },
        el("div", { class: "empty__msg", text: n.message || "Nothing here yet." }),
        n.action ? el("span", { class: "btn btn--primary", text: n.action }) : null);
    },

    text: function (n) { return bars(n.lines || 2, n.label); },

    slot: function (n) {
      return el("div", { class: "slot" },
        el("div", { class: "slot__name", text: "unresolved — " + (n.name || "slot") }),
        n.reason ? el("div", { class: "slot__reason", text: n.reason }) : null);
    }
  };

  function gap(n) { return "gap-" + (n.gap || "base"); }
  function kids(n) { return (n.children || []).map(draw); }
  function cellMod(kind) {
    if (kind === "number") return "cell--num";
    if (kind === "enum") return "cell--enum";
    if (kind === "bool") return "cell--bool";
    return "";
  }

  /* -------------------------------------------------------------- the walk */
  function draw(node) {
    var render = DRAW[node.type];
    if (!render) {
      // The build rejects unknown primitives, so this only fires if the two files
      // drift. Say which one is behind rather than rendering nothing.
      return el("div", { class: "slot" },
        el("div", { class: "slot__name", text: "no renderer for “" + node.type + "”" }),
        el("div", { class: "slot__reason", text: "Declared in primitives.json but missing from DRAW in renderer.js." }));
    }
    var box = el("div", { class: "b" }, render(node));
    var label = node.type + (node.binding ? " · " + node.binding.entity : "");
    box.appendChild(el("span", { class: "tag", text: label }));
    if (node.note) box.appendChild(el("div", { class: "note", text: node.note }));
    return box;
  }

  /* -------------------------------------------------------------- views */
  function screenView(screen) {
    return el("div", {},
      el("div", { class: "titleblock" },
        el("div", { class: "titleblock__body" },
          el("h1", { class: "titleblock__name", text: screen.title }),
          screen.purpose ? el("p", { class: "titleblock__purpose", text: screen.purpose }) : null),
        el("div", { class: "titleblock__meta" },
          metaRow("route", screen.route),
          metaRow("entity", screen.entity || "—"),
          metaRow("spec", "spec/screens/" + screen.id + ".json"))),
      el("div", { class: "sheet" }, draw(screen.body)));
  }

  function metaRow(key, value) {
    return el("div", { class: "titleblock__row" },
      el("span", { class: "titleblock__key", text: key }),
      el("span", { class: "titleblock__val", text: value }));
  }

  function primitivesView() {
    var names = Object.keys(MODEL.primitives).sort();
    return el("div", {},
      el("div", { class: "titleblock" },
        el("div", { class: "titleblock__body" },
          el("h1", { class: "titleblock__name", text: "Vocabulary" }),
          el("p", { class: "titleblock__purpose", text: "Every block on every screen is one of these. The build refuses a node that names anything else, or that carries a prop its primitive does not declare." })),
        el("div", { class: "titleblock__meta" },
          metaRow("primitives", names.length),
          metaRow("nodes drawn", MODEL.stats.nodes),
          metaRow("spec", "spec/primitives.json"))),
      el("div", { class: "sheet" },
        el("div", { class: "ref" }, names.map(function (name) {
          var p = MODEL.primitives[name];
          var used = MODEL.stats.by_type[name] || 0;
          return el("div", { class: "ref__item" },
            el("div", { class: "ref__name", text: name }),
            el("div", { class: "ref__summary", text: p.summary }),
            el("div", { class: "ref__props", text: "props: " + Object.keys(p.props).join(", ") + "   ·   used " + used + "×" }));
        }))));
  }

  function entitiesView() {
    var names = Object.keys(MODEL.entities).sort();
    return el("div", {},
      el("div", { class: "titleblock" },
        el("div", { class: "titleblock__body" },
          el("h1", { class: "titleblock__name", text: "Model" }),
          el("p", { class: "titleblock__purpose", text: "Read from the application's domain model at build time, not restated here. Every table, form and readout in this wireframe draws its fields from this registry, so a field added to the model appears on the screens that bind it." })),
        el("div", { class: "titleblock__meta" },
          metaRow("entities", MODEL.stats.entities),
          metaRow("source", MODEL.meta.model_source),
          metaRow("read via", "ast, not import"))),
      el("div", { class: "sheet" },
        el("div", { class: "ref" }, names.map(function (name) {
          var e = MODEL.entities[name];
          return el("div", { class: "ref__item" },
            el("div", { class: "ref__name", text: name + (e.enum ? "  (enum)" : "") }),
            e.enum
              ? el("div", { class: "chips" }, (e.values || []).map(function (v) {
                  return el("span", { class: "chip", text: v });
                }))
              : el("div", { class: "chips" }, e.fields.map(function (f) {
                  var cls = "chip" + (f.required ? " chip--req" : "") + (f.inherited ? " chip--inh" : "");
                  return el("span", { class: cls, text: f.name + " : " + f.kind });
                })));
        }))));
  }

  /* -------------------------------------------------------------- shell */
  function rail() {
    var nav = el("nav", { class: "rail" },
      el("div", { class: "rail__mark" },
        el("div", { class: "rail__product", text: MODEL.meta.product }),
        el("div", { class: "rail__surface", text: MODEL.meta.surface + " · wireframe" })));

    MODEL.meta.nav_groups.slice().sort(function (a, b) { return a.order - b.order; })
      .forEach(function (group) {
        var members = MODEL.screens.filter(function (s) { return s.nav.group === group.id; });
        if (!members.length) return;
        nav.appendChild(el("div", { class: "rail__group" },
          el("div", { class: "rail__grouplabel", text: group.label }),
          group.hint ? el("div", { class: "rail__grouphint", text: group.hint }) : null,
          el("ul", { class: "rail__list" }, members.map(function (s) {
            return el("li", {}, el("button", {
              class: "rail__link",
              "aria-current": state.view === s.id ? "true" : "false",
              onclick: function () { go(s.id); }
            }, s.title));
          }))));
      });

    nav.appendChild(el("div", { class: "rail__group" },
      el("div", { class: "rail__grouplabel", text: "Reference" }),
      el("div", { class: "rail__grouphint", text: "The system this wireframe is generated from" }),
      el("ul", { class: "rail__list" },
        el("li", {}, el("button", {
          class: "rail__link", "aria-current": state.view === "ref:primitives" ? "true" : "false",
          onclick: function () { go("ref:primitives"); }
        }, "Vocabulary")),
        el("li", {}, el("button", {
          class: "rail__link", "aria-current": state.view === "ref:entities" ? "true" : "false",
          onclick: function () { go("ref:entities"); }
        }, "Model")))));

    nav.appendChild(el("div", { class: "rail__controls" },
      el("button", {
        class: "toggle", "aria-pressed": String(state.annotations),
        onclick: function () { state.annotations = !state.annotations; render(); }
      }, el("span", { class: "toggle__box" }), "Annotations"),
      el("button", {
        class: "toggle", "aria-pressed": String(document.documentElement.dataset.theme === "dark"),
        onclick: function () {
          var root = document.documentElement;
          root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
          render();
        }
      }, el("span", { class: "toggle__box" }), "Dark"),
      el("div", { class: "rail__grouphint", style: "margin-top:6px",
        text: MODEL.stats.screens + " screens · " + MODEL.stats.nodes + " nodes · built " + MODEL.meta.generated })));

    return nav;
  }

  function go(view) {
    state.view = view;
    if (history.replaceState) history.replaceState(null, "", "#" + view);
    render();
    window.scrollTo(0, 0);
  }

  function body() {
    if (state.view === "ref:primitives") return primitivesView();
    if (state.view === "ref:entities") return entitiesView();
    var screen = MODEL.screens.filter(function (s) { return s.id === state.view; })[0];
    return screen ? screenView(screen) : primitivesView();
  }

  function render() {
    document.documentElement.setAttribute("data-annotations", state.annotations ? "on" : "off");
    var app = document.getElementById("app");
    app.textContent = "";
    app.appendChild(el("div", { class: "shell" }, rail(), el("main", { class: "main" }, body())));
  }

  var hash = window.location.hash.slice(1);
  if (hash) state.view = decodeURIComponent(hash);
  render();
})();

</script>
</body>
</html>
